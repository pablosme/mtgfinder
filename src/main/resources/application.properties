spring.application.name=mtgfinder

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}

spring.ai.model.embedding=ollama
spring.ai.model.chat=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.ollama.base-url=${OLLAMA_BASE_URL}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL}
spring.ai.ollama.embedding.num-ctx=${OLLAMA_EMBEDDING_CONTEXT_LENGTH}
spring.ai.ollama.embedding.truncate=${OLLAMA_EMBEDDING_TRUNCATE}

spring.ai.vectorstore.pgvector.dimensions=${OLLAMA_EMBEDDING_DIMENSIONS}
spring.ai.vectorstore.pgvector.initialize-schema=false

# Scryfall
scryfall.api.url=https://api.scryfall.com

# API Config
com.pelia.mtgfinder.user-agent=mtgfinder/1.0
com.pelia.mtgfinder.bulk-insert-batch-size=${BULK_INSERT_BATCH_SIZE:5000}
com.pelia.mtgfinder.embedding-max-tokens=${EMBEDDING_MAX_TOKENS}
com.pelia.mtgfinder.vector-search-limit=${VECTOR_SEARCH_LIMIT:10}
com.pelia.mtgfinder.fuzzy-search-threshold=${FUZZY_SEARCH_THRESHOLD:0.35}
com.pelia.mtgfinder.api-key=${API_KEY}
com.pelia.mtgfinder.api-key-header=${API_KEY_HEADER:X-API-Key}
